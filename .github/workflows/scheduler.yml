name: Facebook Page Auto Reshare
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  reshare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run re-share script
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          SOURCE_PAGE_ID: ${{ secrets.SOURCE_PAGE_ID }}
        run: python ./XDPShare.py
        
